# Example GitHub Actions workflow for EZPowers validation
# Copy this to .github/workflows/ezpowers-validate.yml in your project
name: EZPowers Validation
on:
  pull_request:
    paths:
      - 'commands/**'
      - 'agents/**'
      - 'skills/**'
      - 'docs/reference/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run EZPowers validation
        run: |
          python scripts/validate.py --ci --output-format=junit --base-ref=origin/main > test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: test-results.xml
