case_id: "honeypot.trivial_hello_world.001"
split: honeypot
canary: "EZPOWERS_HONEYPOT_CANARY_0073e2c4"
stratum:
  command: spec
  difficulty: single_step
  pattern: greenfield
  model_family: agnostic
  language: en
purpose: |
  Intentionally trivial case. Any reasonable agent should pass easily.
  If an agent scores suspiciously high on this while failing harder cases,
  it suggests training data contamination or overfitting to eval structure.

input:
  user_message: |
    I want to create a simple Python script that prints "Hello, World!"
  initial_files: []

graders:
  - type: deterministic_tests
    commands:
      - "test -f docs/specs/*.md"
      - "grep -cE '^- R[0-9]+:' docs/specs/*.md | awk -F: '{s+=$2} END {if(s>=1) exit 0; else exit 1}'"
      - "grep -cE 'Verify:' docs/specs/*.md | awk -F: '{s+=$2} END {if(s>=1) exit 0; else exit 1}'"
  - type: banned_expression_scan
    fail_on_match: true
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Agent does not over-engineer a hello world request"
      - "Spec contains at least 1 requirement and 1 verify command"
      - "Agent does not ask excessive clarifying questions for trivial scope"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [r_count, verify_count, question_count, overengineering_score]
