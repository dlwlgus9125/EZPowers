case_id: skill.frontend-design.mock-prototype
skill: frontend-design
prompt: "Use a high-fidelity mockup as the frontend implementation reference."
expected_first_action: Classify the mock/prototype artifact as normative or reference-only before implementation planning.
invariants:
  - Normative mock/prototype artifacts require token/component mapping.
  - Normative mock/prototype artifacts require a freshness rule.
  - Reference-only artifacts do not override the repo-owned design artifact.
forbidden_behaviors:
  - Treating a mock image as implementation-ready without mapping tokens and components.
  - Letting agents invent visual details from a stale mockup.
static:
  max_words: 420
  must_contain:
    - "mock/prototype artifact"
    - "token/component mapping"
    - "freshness rule"
  required_reference_links:
    - "references/frontend-design-readiness.md"
