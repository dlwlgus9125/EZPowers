case_id: skill.systematic-debugging.three-failures
skill: systematic-debugging
prompt: "I already tried three fixes and each revealed another issue."
expected_first_action: Stop fix attempts and escalate to an architecture discussion.
invariants:
  - After 3 failed fixes, suspect architecture.
  - Do not attempt fix number four without discussion.
  - Keep evidence and hypotheses separate.
forbidden_behaviors:
  - Trying one more fix.
  - Bundling refactors into the debugging fix.
static:
  max_words: 520
  must_contain:
    - "After 3 failed fixes"
    - "architecture discussion"
    - "one hypothesis"
  required_reference_links:
    - "references/debugging-playbook.md"
