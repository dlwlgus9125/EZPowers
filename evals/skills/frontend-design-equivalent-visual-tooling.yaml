case_id: skill.frontend-design.equivalent-visual-tooling
skill: frontend-design
prompt: "Review a project that uses Histoire and BackstopJS instead of Storybook and Chromatic."
expected_first_action: Treat equivalent project-local component isolation and visual diff tooling as valid hard-gate triggers.
invariants:
  - Equivalent component isolation tools can satisfy the Storybook lane.
  - Equivalent visual diff tools can trigger the screenshot/visual baseline lane.
  - Tool equivalence must be based on project-local evidence.
forbidden_behaviors:
  - Requiring Storybook when Histoire or Ladle already provides component isolation.
  - Ignoring BackstopJS, Argos, Applitools, jest-image-snapshot, pixelmatch, or lost-pixel.
static:
  max_words: 460
  must_contain:
    - "Ladle or Histoire"
    - "BackstopJS"
    - "pixelmatch"
  required_reference_links:
    - "references/frontend-design-readiness.md"
