case_id: skill.frontend-design.visual-runner
skill: frontend-design
prompt: "Check whether visual readiness should be advisory or blocking."
expected_first_action: Use the visual readiness detector when available and keep it non-installing.
invariants:
  - The detector reports advisory versus hard-gated visual lanes.
  - The detector does not install tools or generate screenshots.
  - The design artifact still owns the decisions agents must implement.
forbidden_behaviors:
  - Installing Storybook or Playwright from the skill.
  - Claiming screenshots were generated by the detector.
static:
  max_words: 420
  must_contain:
    - "scripts/frontend-visual-readiness.py"
    - "hard-gated visual lanes"
    - "Do not implement product UI code"
  required_files:
    - "scripts/frontend-visual-readiness.py"
  required_reference_links:
    - "references/frontend-design-readiness.md"
