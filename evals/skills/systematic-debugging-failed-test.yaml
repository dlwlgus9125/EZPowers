case_id: skill.systematic-debugging.failed-test
skill: systematic-debugging
prompt: "The unit test fails in CI but passes locally. Fix the failing assertion."
expected_first_action: Establish a reproducible feedback loop or state exactly why reproduction failed before proposing any fix.
invariants:
  - Read the full error or stack trace.
  - Check environment differences and recent diffs.
  - Trace where the wrong value first appears.
forbidden_behaviors:
  - Editing the assertion to match CI output before root cause is known.
static:
  max_words: 520
  must_contain:
    - "failing test"
    - "environment differences"
    - "wrong value first appears"
  required_reference_links:
    - "references/debugging-playbook.md"
