case_id: skill.frontend-design.mock-prototype-reference-only
skill: frontend-design
prompt: "Use a Figma prototype only as inspiration while the repo-owned design artifact remains authoritative."
expected_first_action: Classify the prototype as reference-only and keep implementation tied to the repo-owned design artifact.
invariants:
  - Reference-only artifacts do not override the frontend design artifact.
  - The runner must not treat "not normative" as normative.
  - Normative artifacts still require mapping and freshness.
forbidden_behaviors:
  - Treating any Figma link as a source of truth.
  - Hard-gating token/component mapping for an explicitly reference-only mockup.
static:
  max_words: 460
  must_contain:
    - "reference-only"
    - "repo-owned design artifact"
    - "not as"
  required_reference_links:
    - "references/frontend-design-readiness.md"
