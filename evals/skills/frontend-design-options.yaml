case_id: skill.frontend-design.options
skill: frontend-design
prompt: "Design the frontend for a new workflow dashboard."
expected_first_action: Read repo evidence, offer 2-3 design directions, and wait for selected direction before finalizing the frontend design artifact.
invariants:
  - Produce or update docs/ux/frontend-design.md before implementation planning.
  - Record the selected direction or delegated choice.
  - Do not implement UI code from the skill.
forbidden_behaviors:
  - Jumping directly to page implementation.
  - Treating placeholder MVP UI as final design structure.
static:
  max_words: 360
  must_contain:
    - "Propose 2-3 distinct design directions"
    - "docs/ux/frontend-design.md"
    - "Do not implement product UI code"
  required_reference_links:
    - "references/frontend-design-readiness.md"
