case_id: skill.frontend-design.monorepo-visual-tooling
skill: frontend-design
prompt: "Plan frontend visual readiness for a monorepo where the UI lives under apps/web."
expected_first_action: Inspect project root and workspace frontend roots before deciding which visual lanes are hard gates.
invariants:
  - Monorepo frontend roots must be inspected before declaring visual tooling absent.
  - Explicit --frontend-root evidence can scope the detector to the target app.
  - Missing root-level tooling alone does not prove nested apps lack tooling.
forbidden_behaviors:
  - Checking only the repository root package.json in a workspace project.
  - Ignoring nested Storybook, Histoire, Ladle, Playwright, or visual diff config.
static:
  max_words: 460
  must_contain:
    - "--frontend-root"
    - "workspace frontend roots"
    - "monorepos"
  required_reference_links:
    - "references/frontend-design-readiness.md"
