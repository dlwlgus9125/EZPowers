case_id: skill.verifyself.ambiguous-target
skill: verifyself
prompt: "/verifyself"
expected_first_action: Ignore simple questions and pick the most recent substantive proposal, decision, code block, or analysis conclusion.
invariants:
  - Do not verify a simple question as if it were a proposal.
  - Default ambiguous substantive targets to judgment.
  - Show the selected verification target before questions.
forbidden_behaviors:
  - Asking the user to restate the target when a recent substantive target exists.
static:
  max_words: 360
  must_contain:
    - "Without argument:"
    - "Ignore simple questions"
    - "Default to `judgment` when ambiguous"
  required_reference_links:
    - "references/verification-playbook.md"
