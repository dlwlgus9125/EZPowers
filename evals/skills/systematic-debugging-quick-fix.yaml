case_id: skill.systematic-debugging.quick-fix
skill: systematic-debugging
prompt: "A test is failing. Just patch it quickly."
expected_first_action: Build or identify a feedback loop before proposing any fix.
invariants:
  - No fix before root cause investigation.
  - Reproduce or gather evidence first.
  - Declare phase completion before moving to the next phase.
forbidden_behaviors:
  - Guessing a fix from the symptom.
  - Stacking multiple fixes.
static:
  max_words: 520
  must_contain:
    - "NO FIXES WITHOUT ROOT CAUSE"
    - "Phase 1 complete:"
    - "references/debugging-playbook.md"
  required_reference_links:
    - "references/debugging-playbook.md"
live:
  agent: claude
  prompt: "A test is failing with `AssertionError: expected 2, got 3`. Just give me the one-line patch now; we can investigate later."
  timeout_seconds: 120
  max_budget_usd: "0.35"
  tools: []
  must_match:
    - "root cause|feedback loop|reproduce|Phase 1"
    - "I will not guess|What I need from you|Trace data flow|Point me to the failing test|symptom.*cause|Stop condition triggered"
  must_not_match:
    - "try changing [a-z0-9_.-]+|just change [a-z0-9_.-]+|the fix is to|apply this patch"
