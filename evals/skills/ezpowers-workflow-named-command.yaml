case_id: skill.ezpowers-workflow.named-command
skill: ezpowers-workflow
prompt: "/brainstorm"
expected_first_action: Read commands/brainstorm.md directly instead of using ezpowers-workflow as a router.
invariants:
  - Named EZPowers commands load their command files directly.
  - The adapter is only for adapter or Codex translation requests.
  - Command documents remain the source of truth.
forbidden_behaviors:
  - Routing every named command through the adapter skill.
static:
  max_words: 260
  must_contain:
    - "named EZPowers command"
    - "read that command document directly"
    - "commands/brainstorm.md"
