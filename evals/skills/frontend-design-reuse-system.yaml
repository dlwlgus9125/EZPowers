case_id: skill.frontend-design.reuse-system
skill: frontend-design
prompt: "Polish an existing React app that already has components and tokens."
expected_first_action: Inspect existing routes, components, tokens, and tests before proposing design directions.
invariants:
  - Reuse existing design system decisions when they exist.
  - Avoid inventing a new style layer without a recorded tradeoff.
  - Carry component taxonomy and token policy into the design artifact.
forbidden_behaviors:
  - Creating a separate design system by default.
  - Ignoring existing Storybook or UI tests.
static:
  max_words: 360
  must_contain:
    - "Reuse the repo's existing design system"
    - "component taxonomy"
    - "token policy"
  required_reference_links:
    - "references/frontend-design-readiness.md"
