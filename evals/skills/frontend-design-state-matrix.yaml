case_id: skill.frontend-design.state-matrix
skill: frontend-design
prompt: "Prepare a UI spec for a form-heavy settings page."
expected_first_action: Require a UX state matrix and visual/accessibility QA before spec and implementation planning.
invariants:
  - Include loading, empty, error, permission, validation, success, and cancellation states when applicable.
  - Route missing frontend design readiness back before implementation.
  - Sequence component states before screen integration when no suitable design system exists.
forbidden_behaviors:
  - Proceeding with only happy-path screens.
  - Treating accessibility as advisory when acceptance criteria depend on it.
static:
  max_words: 360
  must_contain:
    - "UX state matrix"
    - "accessibility"
    - "tokens -> primitives -> component states/stories -> screens -> e2e/visual"
  required_reference_links:
    - "references/frontend-design-readiness.md"
