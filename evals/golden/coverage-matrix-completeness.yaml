# evals/golden/coverage-matrix-completeness.yaml
# Golden invariant: plan-reviewer MUST detect unmapped R in Coverage Matrix.
# Source: commands/plan.md L51-70, agents/plan-reviewer.md L24-29

case_id: "golden.coverage_matrix_completeness.001"
split: golden
stratum:
  command: plan
  difficulty: single_step
  pattern: coverage_gap
  model_family: agnostic
  language: ko_en_mixed
  verify_type: pure

input:
  user_message: |
    Review the following plan document against its spec.
  initial_files: []
  mock_data:
    spec_content: |
      # Spec: Todo CLI

      ## Extracted Requirements
      - R1: CLI로 todo 항목 추가
      - R2: CLI로 todo 항목 목록 조회
      - R3: CLI로 todo 항목 삭제

      ## R1: CLI로 todo 항목 추가
      Input: todo 텍스트
      Behavior:
      1. 입력 텍스트를 받는다
      2. SQLite DB에 저장한다
      3. 확인 메시지를 출력한다
      Output: "Added: <text>" 메시지
      Impact scope: None -- new component
      Acceptance criteria:
      - Given: CLI 실행 환경, When: `todo add "Buy milk"`, Then: DB에 레코드 추가 및 "Added: Buy milk" 출력, Verify: `./todo add "test" && ./todo list | grep "test"`, Verify-type: cli
      Edge cases:
      - 빈 문자열 입력 시 에러 메시지

      ## R2: CLI로 todo 항목 목록 조회
      Input: 없음
      Behavior:
      1. DB에서 전체 항목 조회
      2. 번호와 함께 출력
      Output: 번호 매긴 목록
      Impact scope: None -- new component
      Acceptance criteria:
      - Given: DB에 항목 존재, When: `todo list`, Then: 번호 매긴 목록 출력, Verify: `./todo list | head -1 | grep -E "^[0-9]+"`, Verify-type: cli
      Edge cases:
      - 항목 없을 때 "No items" 메시지

      ## R3: CLI로 todo 항목 삭제
      Input: todo 번호
      Behavior:
      1. 번호로 항목 조회
      2. 존재하면 삭제
      3. 결과 출력
      Output: "Deleted: <text>" 메시지
      Impact scope: None -- new component
      Acceptance criteria:
      - Given: DB에 항목 존재, When: `todo delete 1`, Then: 해당 항목 삭제 및 확인 메시지, Verify: `./todo add "x" && ./todo delete 1 && ./todo list | grep -v "x"`, Verify-type: cli
      Edge cases:
      - 존재하지 않는 번호 삭제 시 에러

    plan_content: |
      # Plan: Todo CLI

      ## Coverage Matrix

      | Requirement | Related Tasks |
      |-------------|---------------|
      | R1: CLI로 todo 항목 추가 | T1 |
      | R2: CLI로 todo 항목 목록 조회 | T2 |

      ## Task 1: Implement add command
      **Files:**
      - Create: src/main.py
      - Create: src/db.py

      **Completion criteria (R1):**
      - `todo add "text"` adds record to DB

      **Verification method:**
      ```bash
      ./todo add "test" && ./todo list | grep "test"
      ```

      ## Task 2: Implement list command
      **Files:**
      - Modify: src/main.py

      **Completion criteria (R2):**
      - `todo list` shows numbered items

      **Verification method:**
      ```bash
      ./todo list | head -1 | grep -E "^[0-9]+"
      ```

graders:
  - type: deterministic_tests
    commands:
      # Verdict must be FAIL
      - "grep -q '## Verdict: FAIL' $REVIEW_OUTPUT"
      # R3 must be explicitly called out as unmapped
      - "grep -q 'R3' $REVIEW_OUTPUT"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Reviewer detected R3 is missing from the Coverage Matrix"
      - "Reviewer listed R3 as unmapped requirement"
      - "Verdict is FAIL due to incomplete Coverage Matrix"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [unmapped_r_count, coverage_completeness_ratio]
