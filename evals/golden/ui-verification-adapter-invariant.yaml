# evals/golden/ui-verification-adapter-invariant.yaml
# Golden invariant: UI verification must be adapter-capability based and never Playwright-only.

case_id: "golden.ui_verification_adapter.001"
split: golden
stratum:
  command: prepare_execute
  difficulty: single_step
  pattern: ui_adapter_fallback
  model_family: agnostic
  language: en
  verify_type: pure

input:
  user_message: |
    Verify that UI work keeps the same user-observable oracle even when Playwright cannot run.
  initial_files: []
  mock_data: {}

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; c=Path('commands/prepare_execute.md').read_text(encoding='utf-8'); assert all(s in c for s in ['select the strongest available adapter','user-observable oracle','insert a prerequisite'])\""
      - "python -c \"from pathlib import Path; u=Path('docs/reference/ui-verification-adapter-contract.md').read_text(encoding='utf-8'); assert all(s in u for s in ['Playwright is the preferred browser e2e','Equivalent means the replacement verifies the same observable claim','adapter_fallback_task_required'])\""
      - "python -c \"from pathlib import Path; p=Path('docs/reference/plan-contract.md').read_text(encoding='utf-8'); assert all(s in p for s in ['## UI Verification Adapter Tasks','Task 0: Install UI Verification Adapter','Do not replace a UI acceptance criterion'])\""
      - "python -c \"from pathlib import Path; a=Path('docs/reference/pipeline-audit-contract.md').read_text(encoding='utf-8'); assert 'UI verification adapter availability' in a\""

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [ui_adapter_fallback_guarded]
