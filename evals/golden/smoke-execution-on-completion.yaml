# evals/golden/smoke-execution-on-completion.yaml
# Golden invariant: choiceexecutor Section 14 MUST execute the runtime gate
# for executable artifacts.

case_id: "golden.smoke_execution_completion.001"
split: golden
stratum:
  command: choiceexecutor
  difficulty: single_step
  pattern: smoke_execution
  model_family: agnostic
  language: ko_en_mixed
  verify_type: pure

input:
  user_message: |
    Verify that choiceexecutor completion phase treats executable runtime smoke as a hard gate.
  initial_files: []
  mock_data:
    smoke_command_present: "npm run smoke"
    required_smoke_missing: true

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; c=Path('commands/choiceexecutor.md').read_text(encoding='utf-8'); v=Path('docs/reference/verification-contract.md').read_text(encoding='utf-8'); assert 'docs/reference/verification-contract.md' in c; assert all(s in c for s in ['config.smoke.required','config.smoke.command','artifact_kind: docs|library','Expected UI text/name missing']); assert all(s in v for s in ['Executable artifacts (`cli`, `server`, `desktop`) require runtime smoke','missing required smoke command is failure, not skip','Runtime probe success never replaces a Verify command'])\""

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [required_smoke_gate_present, executable_skip_forbidden]
