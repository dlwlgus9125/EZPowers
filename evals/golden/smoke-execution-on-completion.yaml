# evals/golden/smoke-execution-on-completion.yaml
# Golden invariant: choiceexecutor Section 14 MUST execute config.smoke.command when non-empty.
# Source: commands/choiceexecutor.md Section 14

case_id: "golden.smoke_execution_completion.001"
split: golden
stratum:
  command: choiceexecutor
  difficulty: single_step
  pattern: smoke_execution
  model_family: agnostic
  language: ko_en_mixed
  verify_type: pure

input:
  user_message: |
    Verify that choiceexecutor completion phase includes smoke test execution.
  initial_files: []
  mock_data:
    smoke_command_present: "npm run smoke"
    smoke_command_empty: ""

graders:
  - type: deterministic_tests
    commands:
      # Codebase invariant: choiceexecutor.md Section 14 must mention smoke
      - "grep -qi 'smoke' commands/choiceexecutor.md"
      # Must mention config.smoke.command execution
      - "grep -q 'config.smoke.command' commands/choiceexecutor.md"
      # Must handle empty smoke.command (skip case)
      - "grep -qiE '빈 문자열|empty|스킵' commands/choiceexecutor.md"
      # Escalation table must include smoke test row
      - "grep -qi 'smoke test' commands/choiceexecutor.md"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [smoke_mention_count, skip_handling_present]
