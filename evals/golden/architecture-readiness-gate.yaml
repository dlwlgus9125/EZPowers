# Golden invariant: brainstorm and audit must enforce architecture readiness.

case_id: "golden.architecture_readiness_gate.002"
split: golden
stratum:
  command: spec
  difficulty: single_step
  pattern: architecture_gate
  model_family: agnostic
  language: en
  verify_type: pure

input:
  user_message: |
    Verify that architecture readiness remains a mandatory gate.
  initial_files: []

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; c=[p for p in (Path('skills/spec/SKILL.md'),Path('commands/spec.md')) if p.exists()][0].read_text(encoding='utf-8'); assert all(s in c for s in ['docs/reference/spec-contract.md','docs/reference/architecture-readiness-contract.md','docs/reference/dispatch-protocol.md'])\""
      - "python -c \"from pathlib import Path; d=Path('docs/reference/architecture-readiness-contract.md').read_text(encoding='utf-8'); assert all(s in d for s in ['Architecture Baseline','ASR Ledger','Option Matrix','Lifecycle And Operations','Quality Budgets','Decision Log','Extracted Requirements'])\""
      - "python -c \"from pathlib import Path; s=Path('docs/reference/spec-contract.md').read_text(encoding='utf-8'); p=Path('docs/reference/dispatch-protocol.md').read_text(encoding='utf-8'); assert 'ezpowers:architecture-reviewer' in s and 'ezpowers:architecture-reviewer' in p\""
      - "python -c \"from pathlib import Path; assert 'D7: Architecture Readiness' in Path('docs/reference/pipeline-audit-contract.md').read_text(encoding='utf-8')\""
      - "python -c \"from pathlib import Path; assert 'ASR carry-forward' in Path('agents/plan-reviewer.md').read_text(encoding='utf-8')\""
      - "python -c \"from pathlib import Path; assert 'ASR Evidence' in Path('agents/code-reviewer.md').read_text(encoding='utf-8')\""

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [architecture_gate_present]
