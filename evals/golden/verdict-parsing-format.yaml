# evals/golden/verdict-parsing-format.yaml
# Golden invariant: Verdict MUST use exact `## Verdict: PASS` or `## Verdict: FAIL` format.
# Non-standard formats (missing ##, wrong casing, extra whitespace) = treated as FAIL.
# Source: agents/spec-reviewer.md L102-108, agents/plan-reviewer.md L105-111,
#         commands/choiceexecutor.md L428-430

case_id: "golden.verdict_parsing_format.001"
split: golden
stratum:
  command: choiceexecutor
  difficulty: single_step
  pattern: verdict_format
  model_family: agnostic
  language: en
  verify_type: pure

input:
  user_message: |
    Parse the following reviewer outputs and determine the verdict for each.
  initial_files: []
  mock_data:
    # Case A: correct format — should parse as PASS
    reviewer_output_valid: |
      ## Spec Review

      **Status:** Approved

      ## Verdict: PASS

      **Issues (if any):**
      - None

    # Case B: missing ## prefix — should be treated as FAIL per choiceexecutor.md
    # "## Verdict: 패턴이 서브에이전트 반환에서 발견되지 않으면 FAIL로 처리"
    reviewer_output_invalid_no_hash: |
      ## Spec Review

      **Status:** Approved

      Verdict: PASS

      **Issues (if any):**
      - None

    # Case C: wrong heading level — should be treated as FAIL
    reviewer_output_invalid_wrong_level: |
      ## Spec Review

      **Status:** Approved

      ### Verdict: PASS

      **Issues (if any):**
      - None

    # Case D: correct FAIL format — should parse as FAIL
    reviewer_output_valid_fail: |
      ## Spec Review

      **Status:** Issues Found

      ## Verdict: FAIL

      **Issues (if any):**
      - [R1]: Missing edge cases

graders:
  - type: deterministic_tests
    commands:
      # Case A: valid mock contains exact "## Verdict: PASS" (fixture sanity)
      - "python -c \"from pathlib import Path; assert any(line == '## Verdict: PASS' for line in Path($MOCK_reviewer_output_valid).read_text(encoding='utf-8').splitlines())\""
      # Case B: invalid mock (no ## prefix) must NOT match the required pattern
      - "python -c \"from pathlib import Path; assert not any(line.startswith('## Verdict:') for line in Path($MOCK_reviewer_output_invalid_no_hash).read_text(encoding='utf-8').splitlines())\""
      # Case C: wrong heading level (###) must NOT match ## pattern
      - "python -c \"from pathlib import Path; assert not any(line.startswith('## Verdict:') for line in Path($MOCK_reviewer_output_invalid_wrong_level).read_text(encoding='utf-8').splitlines())\""
      # Case D: valid FAIL mock contains exact "## Verdict: FAIL"
      - "python -c \"from pathlib import Path; assert any(line == '## Verdict: FAIL' for line in Path($MOCK_reviewer_output_valid_fail).read_text(encoding='utf-8').splitlines())\""
      # Verify the parsing rule is documented in choiceexecutor.md
      - "python -c \"import re; from pathlib import Path; t=Path('commands/choiceexecutor.md').read_text(encoding='utf-8'); assert re.search(r'## Verdict.*PASS.*FAIL|Verdict.*FAIL', t, re.I | re.S)\""
      # Verify brainstorm.md documents Verdict header parsing
      - "python -c \"from pathlib import Path; c=Path('commands/brainstorm.md').read_text(encoding='utf-8'); d=Path('docs/reference/dispatch-protocol.md').read_text(encoding='utf-8'); assert 'docs/reference/dispatch-protocol.md' in c; assert all(s in d for s in ['## Verdict: PASS','## Verdict: FAIL','missing or malformed'])\""
      # Verify architecture-reviewer uses the same verdict contract
      - "python -c \"from pathlib import Path; t=Path('agents/architecture-reviewer.md').read_text(encoding='utf-8'); assert '\\n## Verdict: PASS' in t or t.startswith('## Verdict: PASS')\""
      - "python -c \"from pathlib import Path; t=Path('agents/architecture-reviewer.md').read_text(encoding='utf-8'); assert '\\n## Verdict: FAIL' in t or t.startswith('## Verdict: FAIL')\""
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Only outputs with exact '## Verdict: PASS' or '## Verdict: FAIL' (level-2 heading) are accepted"
      - "Missing ## prefix causes the output to be treated as FAIL regardless of content"
      - "Wrong heading level (### instead of ##) causes the output to be treated as FAIL"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [valid_format_count, invalid_format_count, parsing_accuracy]
