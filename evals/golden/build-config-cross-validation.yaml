# evals/golden/build-config-cross-validation.yaml
# Golden invariant: plan-reviewer MUST cross-validate build config against dependency compatibility.
# Source: agents/plan-reviewer.md check 6

case_id: "golden.build_config_cross_validation.001"
split: golden
stratum:
  command: prepare_execute
  difficulty: single_step
  pattern: build_dep_compat
  model_family: agnostic
  language: en
  verify_type: pure

input:
  user_message: |
    Verify that plan-reviewer checks build config compatibility with dependencies.
  initial_files: []
  mock_data: {}

graders:
  - type: deterministic_tests
    commands:
      # Codebase invariant: plan-reviewer must mention build config cross-validation
      - "python -c \"from pathlib import Path; t=Path('agents/plan-reviewer.md').read_text(encoding='utf-8').lower(); assert 'build config' in t\""
      # Must mention externalize/module system compatibility
      - "python -c \"from pathlib import Path; t=Path('agents/plan-reviewer.md').read_text(encoding='utf-8'); assert any(s in t for s in ['externalize','module system','CJS','ESM'])\""
      # Must mention blanket pattern detection
      - "python -c \"from pathlib import Path; assert 'blanket' in Path('agents/plan-reviewer.md').read_text(encoding='utf-8').lower()\""

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [cross_validation_present, blanket_detection_present]
