case_id: "optimization.spec_reviewer_verdict_parsing.005"
split: optimization
stratum:
  command: brainstorm
  difficulty: single_step
  pattern: contract
  model_family: agnostic
  language: en

input:
  user_message: |
    Verify that brainstorm correctly parses spec-reviewer Verdict header.
  initial_files: []
  mock_data:
    reviewer_outputs:
      - output: "## Verdict: PASS\n\nAll checks passed."
        expected_parse: "PASS"
      - output: "## Verdict: FAIL\n\n**Issues:**\n- R1: missing edge cases"
        expected_parse: "FAIL"
      - output: "Verdict: PASS\n\nLooks good."
        expected_parse: "FAIL (no ## prefix -> treated as FAIL)"
      - output: "The spec looks great overall.\n\nNo issues found."
        expected_parse: "FAIL (no Verdict header at all)"

graders:
  - type: deterministic_tests
    commands:
      - "echo 'grader placeholder — verdict parsing check'"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Only '## Verdict: PASS' (level-2 heading) is parsed as PASS"
      - "Missing ## prefix treated as FAIL"
      - "Absent Verdict header treated as FAIL"
      - "2 consecutive Verdict header misses trigger user escalation"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [verdict_parsed_correctly, escalation_on_missing_header]
