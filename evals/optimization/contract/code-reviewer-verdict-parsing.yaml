case_id: "optimization.code_reviewer_verdict_parsing.007"
split: optimization
stratum:
  command: choice_execute
  difficulty: single_step
  pattern: contract
  model_family: agnostic
  language: en

input:
  user_message: |
    Verify that choice_execute correctly parses code-reviewer Verdict header.
  initial_files: []
  mock_data:
    reviewer_outputs:
      - output: "## Verdict: PASS\n\n## Spec Evidence\n| R1 | file:42 | VERIFIED |"
        expected_parse: "PASS"
      - output: "## Verdict: FAIL\n\n## Issues\n- [src/auth.ts:15] [critical] SQL injection"
        expected_parse: "FAIL"
      - output: "Overall the code looks good. PASS."
        expected_parse: "FAIL (no ## Verdict: header)"

graders:
  - type: deterministic_tests
    commands:
      - "echo 'grader placeholder — code-reviewer verdict parsing check'"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Only '## Verdict: PASS' or '## Verdict: FAIL' parsed"
      - "Missing Verdict header -> FAIL + user escalation"
      - "Oscillation detection from iteration 3 using {file}:{issue_type} keys"
      - "Final code review: warn@5, stop@10"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [verdict_parsed_correctly, escalation_thresholds_correct]
