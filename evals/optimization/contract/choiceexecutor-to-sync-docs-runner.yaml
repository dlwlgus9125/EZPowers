case_id: "optimization.workflow_runner.007"
split: optimization
stratum:
  command: choice_execute
  difficulty: single_step
  pattern: contract
  model_family: agnostic
  language: en

input:
  user_message: |
    Verify that choice_execute invokes sync-docs through workflow-runner after final verification.
  initial_files: []

graders:
  - type: deterministic_tests
    commands:
      - "cat skills/choice-execute/SKILL.md commands/choice_execute.md 2>/dev/null | grep -q 'subagent_type: \"ezpowers:workflow-runner\"'"
      - "cat skills/choice-execute/SKILL.md commands/choice_execute.md 2>/dev/null | grep -q '\\*\\*Target command:\\*\\* /sync-docs'"
      - "cat skills/choice-execute/SKILL.md commands/choice_execute.md 2>/dev/null | grep -q '\\*\\*Invocation mode:\\*\\* auto-from-choice_execute'"
      - "cat skills/choice-execute/SKILL.md commands/choice_execute.md 2>/dev/null | grep -q 'docs_sync'"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Choiceexecutor dispatches workflow-runner to run sync-docs as work, not as a review"
      - "Docs sync runs after final code review and smoke verification"
      - "Docs sync result is recorded in phases/index.json"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [workflow_runner_dispatch_present, docs_sync_status_recorded]
