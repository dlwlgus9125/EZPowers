case_id: "optimization.brainstorm_to_plan_spec_format.001"
split: optimization
stratum:
  command: spec
  difficulty: multi_step
  pattern: contract
  model_family: agnostic
  language: en

input:
  user_message: |
    Verify that the spec output from brainstorm is consumable by plan.
  initial_files: []
  mock_data:
    spec_content: |
      ## Architecture Baseline
      **Selected approach:** Layered API
      **Summary:** Users access auth endpoints through routes, services, and persistence.
      **Existing constraints:** Express API with PostgreSQL.
      **Boundary map:** Routes call services; services call persistence.

      ## ASR Ledger
      | ASR | Quality Attribute | Measurable Target | Design Impact | Verification |
      |-----|-------------------|-------------------|---------------|--------------|
      | ASR-1 | Security | Passwords are never stored in plaintext | Auth service owns hashing | `grep -R "password" src/` review |

      ## Option Matrix
      | Option | Tradeoffs | Selected |
      |--------|-----------|----------|
      | Layered API | Clear boundaries, more files | yes |
      | Route-only logic | Fewer files, weak boundaries | no |

      ## Lifecycle And Operations
      - Lifecycle stage: mvp
      - Startup/shutdown: server process
      - Deployment/runtime: Node.js
      - Migration/compatibility: additive user tables
      - Observability: request logs
      - Recovery: retry database connection
      - Ownership: API team

      ## Quality Budgets
      - Performance: none declared; risk is unknown auth latency
      - Reliability: auth endpoints return deterministic status codes
      - Security: passwords hashed before persistence
      - Cost: none declared; risk is unbounded auth traffic
      - Maintainability: routes do not contain hashing logic

      ## Decision Log
      - ADR required: no
      - ADR candidates: none
      - Decisions deferred: none

      ## Extracted Requirements
      - R1: User registration
      - R2: User login

      ### R1: User registration
      **ASR:** ASR-1
      **Input:** Name, email, password
      **Behavior:** Validate input, hash password, create user record
      **Output:** User object with ID
      **Impact scope:** None -- new component
      **Acceptance criteria:**
      - [ ] Given: Valid registration data, When: POST /api/users, Then: 201 with user ID, Verify: `curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/users -d '{}'`, Verify-type: api
      **Edge cases:**
      - Duplicate email returns 409

      ### R2: User login
      **ASR:** ASR-1
      **Input:** Email, password
      **Behavior:** Validate credentials, generate session token
      **Output:** Session token
      **Impact scope:** None -- new component
      **Acceptance criteria:**
      - [ ] Given: Registered user, When: POST /api/auth/login, Then: 200 with token, Verify: `curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/auth/login -d '{}'`, Verify-type: api
      **Edge cases:**
      - Invalid credentials return 401

graders:
  - type: deterministic_tests
    commands:
      - "grep -cE '^- R[0-9]+:' $SPEC_FILE | awk '{if($1>=2) exit 0; else exit 1}'"
      - "grep -qE '### R[0-9]+:' $SPEC_FILE"
      - "grep -qE 'Verify:' $SPEC_FILE"
      - "grep -qE 'Verify-type:' $SPEC_FILE"
      - "grep -qE 'Impact scope:' $SPEC_FILE"
      - "grep -qE 'Acceptance criteria:' $SPEC_FILE"
      - "for s in 'Architecture Baseline' 'ASR Ledger' 'Option Matrix' 'Lifecycle And Operations' 'Quality Budgets' 'Decision Log'; do grep -q \"$s\" $SPEC_FILE || exit 1; done"
      - "grep -qE '^\\*\\*ASR:\\*\\*' $SPEC_FILE"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Extracted Requirements list uses R1, R2 format parseable by plan Coverage Matrix"
      - "Each R section follows the ASR plus 6-field structure plan.md expects"
      - "Verify commands are shell commands that plan can copy to completion criteria"
      - "Verify-type is one of {api,e2e,cli,lib,data,pure}"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [r_format_valid, verify_format_valid, structure_complete]
