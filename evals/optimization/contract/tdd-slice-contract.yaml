case_id: "optimization.tdd_slice_contract.001"
split: optimization
stratum:
  command: prepare_execute
  difficulty: single_step
  pattern: contract
  model_family: agnostic
  language: en

input:
  user_message: |
    Verify that EZPowers plan and implementer prompts require concise TDD slice contracts instead of verbose but incomplete implementation prose.
  initial_files: []

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; c=[p for p in (Path('skills/prepare-execute/SKILL.md'),Path('commands/prepare_execute.md')) if p.exists()][0].read_text(encoding='utf-8'); p=Path('docs/reference/plan-contract.md').read_text(encoding='utf-8'); v=Path('docs/reference/verification-contract.md').read_text(encoding='utf-8'); assert all(x in c for x in ['docs/reference/plan-contract.md','docs/reference/verification-contract.md']); assert all(x in p for x in ['**TDD Slice Contract:** Public interface','Behavior under test','Test oracle','Missing-info handling: report NEEDS_CONTEXT/BLOCKED']); assert all(x in v for x in ['Behavior-bearing tasks must include a TDD Slice Contract','public interface','test oracle','missing-info handling'])\""
      - "python -c \"from pathlib import Path; t=Path('agents/implementer-prompt.md').read_text(encoding='utf-8'); assert 'TDD slice contract' in t and 'NEEDS_CONTEXT/BLOCKED instead of guessing' in t\""
      - "python -c \"from pathlib import Path; t=Path('agents/plan-reviewer.md').read_text(encoding='utf-8'); assert 'TDD Slice Contract density' in t and 'verbose internal implementation prose' in t\""
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Plan tasks include the compact contract fields needed to write a failing test."
      - "Implementers are told to stop instead of guessing when the slice contract is incomplete."
      - "The reviewer rejects verbose implementation prose that lacks public interface and test oracle details."

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [tdd_slice_contract_present, missing_info_gate_present, verbose_prose_rejected]
