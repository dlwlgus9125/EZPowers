case_id: "optimization.workflow_runner.006"
split: optimization
stratum:
  command: prepare_execute
  difficulty: single_step
  pattern: contract
  model_family: agnostic
  language: en

input:
  user_message: |
    Verify that plan invokes pipeline-audit through workflow-runner after plan completion.
  initial_files: []

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; c=Path('commands/prepare_execute.md').read_text(encoding='utf-8'); p=Path('docs/reference/plan-contract.md').read_text(encoding='utf-8'); d=Path('docs/reference/dispatch-protocol.md').read_text(encoding='utf-8'); assert all(x in c for x in ['docs/reference/dispatch-protocol.md','ezpowers:workflow-runner','internal pipeline audit','post-prepare_execute']); assert all(x in p for x in ['ezpowers:workflow-runner','internal pipeline audit','post-prepare_execute']); assert 'may run only `internal pipeline audit` or `/sync-docs`' in d\""
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Plan dispatches workflow-runner, not a reviewer-only subagent"
      - "The dispatch occurs after phases/index.json records the completed plan"
      - "Choiceexecutor proceeds only on pipeline-audit PASS or WARN"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [workflow_runner_dispatch_present, audit_mode_post_plan]
