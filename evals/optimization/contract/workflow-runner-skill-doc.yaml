case_id: "optimization.workflow_runner_skill_doc.001"
split: optimization
stratum:
  command: sync-docs
  difficulty: single_step
  pattern: contract
  model_family: agnostic
  language: en
  verify_type: pure

input:
  user_message: |
    Verify that workflow-runner reads the migrated sync-docs skill document
    and that the document still defines the automated invocation mode.
  initial_files: []

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; t=Path('agents/workflow-runner.md').read_text(encoding='utf-8'); assert 'skills/sync-docs/SKILL.md' in t; assert 'commands/sync-docs.md' not in t\""
      - "python -c \"from pathlib import Path; t=Path('skills/sync-docs/SKILL.md').read_text(encoding='utf-8'); assert 'auto-from-choice_execute' in t; assert 'NEEDS_USER' in t\""

tracked_metrics:
  transcript: []
  custom: [runner_reads_skill_doc, auto_mode_preserved]
