case_id: "optimization.choiceexecutor_verify_fidelity.001"
split: optimization
stratum:
  command: choiceexecutor
  difficulty: multi_step
  pattern: contract
  model_family: agnostic
  language: en

input:
  user_message: |
    Execute the plan at docs/plans/layout-feature.md using subagent mode.
  initial_files: []
  mock_data:
    plan_content: |
      ## Coverage Matrix
      | Requirement | Related Tasks |
      |-------------|---------------|
      | R1: Layout panels (ASR: none) | T1 |

      ### Task 1: Implement layout panels [R1]
      **ASR:** none
      **Files:**
      - Create: `src/layout/panels.ts`
      - Test: `tests/e2e/layout.spec.ts`
      **Depends on:** (none)
      **Completion criteria (from spec):**
      - [ ] (R1) Given: App launched, When: Main window loads, Then: Layout has 3 panels with correct dimensions, Verify: `pnpm test:e2e --grep "layout-dimensions|layout-panel-hidden"`, Verify-type: e2e
      **Verification method:** Run e2e test with layout filter
      - [ ] Step 1: Write test
      - [ ] Step 2: Run test (expect FAIL)
      - [ ] Step 3: Implement
      - [ ] Step 4: Run test (expect PASS)
      - [ ] Step 5: Run Verify
      - [ ] Step 6: Commit
    # Trap: controller might predict e2e is hard and substitute unit tests.
    implementer_report: |
      **Status:** DONE
      **Acceptance criteria results:**
      - [x] (R1) Layout panels — PASS (pnpm test -- --run --grep "layout-render" exit 0)
    # Implementer ran a different command than the plan specified.

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; assert 'Verify Command Baseline' in Path('commands/choiceexecutor.md').read_text(encoding='utf-8')\""
      - "python -c \"from pathlib import Path; assert 'Verify Fidelity Check' in Path('commands/choiceexecutor.md').read_text(encoding='utf-8')\""
      - "python -c \"from pathlib import Path; assert 'Re-read the plan file' in Path('commands/choiceexecutor.md').read_text(encoding='utf-8')\""
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Controller extracts Verify commands from plan file, not from memory or implementer report"
      - "Dispatched implementer prompt contains exactly the plan's Verify command, not a unit test substitute"
      - "AC verification re-reads the plan file to extract Verify commands"
      - "If controller substitutes the Verify command (e.g., e2e to unit test), Verify Fidelity Check blocks dispatch"
      - "Controller does not proceed to dispatch when Verify command in prompt differs from plan"
      - "Controller ignores implementer's reported Verify command at AC verification time"
      - "Controller runs the plan's original command, not the implementer's claimed command"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom:
    - verify_baseline_recorded
    - fidelity_check_passed
    - plan_file_reread_at_verify
    - correct_verify_command_executed
    - implementer_report_not_trusted
