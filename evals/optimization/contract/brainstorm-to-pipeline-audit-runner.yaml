case_id: "optimization.workflow_runner.005"
split: optimization
stratum:
  command: brainstorm
  difficulty: single_step
  pattern: contract
  model_family: agnostic
  language: en

input:
  user_message: |
    Verify that brainstorm invokes pipeline-audit through workflow-runner after spec approval.
  initial_files: []

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; c=Path('commands/brainstorm.md').read_text(encoding='utf-8'); s=Path('docs/reference/spec-contract.md').read_text(encoding='utf-8'); d=Path('docs/reference/dispatch-protocol.md').read_text(encoding='utf-8'); assert all(x in c for x in ['docs/reference/dispatch-protocol.md','ezpowers:workflow-runner','/pipeline-audit','post-brainstorm']); assert all(x in s for x in ['ezpowers:workflow-runner','/pipeline-audit','post-brainstorm']); assert 'may run only `/pipeline-audit` or `/sync-docs`' in d\""
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Brainstorm dispatches workflow-runner, not a reviewer-only subagent"
      - "The dispatch occurs after user spec approval"
      - "Planning proceeds only on pipeline-audit PASS or WARN"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [workflow_runner_dispatch_present, audit_mode_post_brainstorm]
