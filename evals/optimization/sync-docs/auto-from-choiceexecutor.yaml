case_id: "optimization.sync_docs.003"
split: optimization
stratum:
  command: sync-docs
  difficulty: single_step
  pattern: docs_sync
  model_family: agnostic
  language: en

input:
  user_message: |
    Verify that sync-docs has an automated mode for workflow-runner invocation.
  initial_files: []

graders:
  - type: deterministic_tests
    commands:
      - "cat skills/sync-docs/SKILL.md commands/sync-docs.md 2>/dev/null | grep -qE 'Automated Invocation From ./choice[-_]execute.'"
      - "cat skills/sync-docs/SKILL.md commands/sync-docs.md 2>/dev/null | grep -q 'auto-from-choice_execute'"
      - "cat skills/sync-docs/SKILL.md commands/sync-docs.md 2>/dev/null | grep -q 'Auto-apply only'"
      - "cat skills/sync-docs/SKILL.md commands/sync-docs.md 2>/dev/null | grep -q 'NEEDS_USER'"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Standalone sync-docs still asks for user approval"
      - "Auto mode applies safe New and Changed facts without approval"
      - "Auto mode returns NEEDS_USER for destructive or ambiguous changes"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [auto_mode_present, standalone_approval_preserved]
