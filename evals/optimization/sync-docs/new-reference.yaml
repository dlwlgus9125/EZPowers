case_id: "optimization.new_reference.001"
split: optimization
stratum:
  command: sync-docs
  difficulty: single_step
  pattern: brownfield
  model_family: agnostic
  language: en

input:
  user_message: |
    Sync the reference docs with the current codebase.
  initial_files:
    - "AGENTS.md"
    - ".harness/config.json"
    - "docs/INDEX.md"
    - "docs/reference/architecture.md"
    - "src/billing/index.ts"
    - "src/auth/index.ts"
    - "package.json"

graders:
  - type: deterministic_tests
    commands:
      - "echo 'grader placeholder — new module detection check'"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Scan detects new src/billing/ module not in architecture.md"
      - "Update proposal lists the new module as [new]"
      - "User approval requested before applying changes"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [new_modules_detected, proposals_generated, user_approval_requested]
