case_id: "optimization.spec_drift.002"
split: optimization
stratum:
  command: review
  difficulty: multi_step
  pattern: brownfield
  model_family: agnostic
  language: ko_en_mixed

input:
  user_message: |
    변경사항을 리뷰해주세요. Spec이 있으면 대비해서 검증해주세요.
  initial_files:
    - "docs/specs/2026-04-25-user-api-design.md"
    - ".harness/config.json"
    - "AGENTS.md"
  mock_data:
    spec_note: "Spec requires R1-R3, but implementation only covers R1-R2. R3 (user roles) is missing."

graders:
  - type: deterministic_tests
    commands:
      - "echo 'grader placeholder — spec drift detection check'"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Review detects implementation gap — R3 not implemented"
      - "Missing requirement flagged as critical finding"
      - "Evidence-based finding with spec reference"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [drift_detected, missing_requirements, severity_breakdown]
