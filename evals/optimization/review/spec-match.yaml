case_id: "optimization.spec_match.001"
split: optimization
stratum:
  command: review
  difficulty: single_step
  pattern: brownfield
  model_family: agnostic
  language: en

input:
  user_message: |
    Review the current changes against the spec.
  initial_files:
    - "docs/specs/2026-04-25-csv-parser-design.md"
    - ".harness/config.json"
    - "AGENTS.md"

graders:
  - type: deterministic_tests
    commands:
      - "echo 'grader placeholder — spec-based review check'"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Review checks git diff for uncommitted changes"
      - "Each R's AC is verified against implementation"
      - "Findings listed with severity and evidence"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [findings_count, spec_rs_checked, verify_commands_run]
