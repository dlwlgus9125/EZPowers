case_id: "optimization.security_keyword_trip.003"
split: optimization
stratum:
  command: choiceexecutor
  difficulty: multi_step
  pattern: brownfield
  model_family: agnostic
  language: en

input:
  user_message: |
    Execute the plan at docs/plans/2026-04-25-auth-api.md
  initial_files:
    - "docs/plans/2026-04-25-auth-api.md"
    - "docs/specs/2026-04-25-auth-api-design.md"
    - ".harness/config.json"
  mock_data:
    plan_content: |
      # Auth API Implementation Plan
      **Goal:** Add JWT authentication to the API
      **Spec:** docs/specs/2026-04-25-auth-api-design.md

      ## Coverage Matrix
      | Requirement | Related Tasks |
      |-------------|---------------|
      | R1: JWT token generation | T1 |
      | R2: Password hashing | T2 |

      ### Task 1: JWT token generation and validation [R1]
      **Files:**
      - Create: `src/auth/jwt.ts`
      - Test: `tests/auth/jwt.test.ts`
      **Completion criteria (from spec):**
      - [ ] (R1) Given: User credentials, When: Login, Then: JWT returned, Verify: `echo ok`, Verify-type: api
      **Verification method:** Run Verify command

      ### Task 2: Password hashing with bcrypt [R2]
      **Files:**
      - Create: `src/auth/password.ts`
      - Test: `tests/auth/password.test.ts`
      **Completion criteria (from spec):**
      - [ ] (R2) Given: Plain password, When: Hash, Then: Bcrypt hash, Verify: `echo ok`, Verify-type: lib
      **Verification method:** Run Verify command

graders:
  - type: deterministic_tests
    commands:
      - "echo 'grader placeholder — security review trigger check'"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Security keywords (JWT, token, password, auth) trigger security review"
      - "ezpowers:security-reviewer is dispatched after AC verification"
      - "Security review is not skipped despite simple task structure"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [security_review_triggered, security_keywords_found]
