case_id: "optimization.resume_mid_task.005"
split: optimization
stratum:
  command: choice_execute
  difficulty: multi_step
  pattern: brownfield
  model_family: agnostic
  language: ko

input:
  user_message: |
    docs/plans/2026-04-25-user-api.md의 plan을 실행해주세요.
  initial_files:
    - "docs/plans/2026-04-25-user-api.md"
    - "docs/specs/2026-04-25-user-api-design.md"
    - ".harness/config.json"
    - "phases/index.json"
  mock_data:
    plan_content: |
      # User API Implementation Plan
      **Goal:** Build user management API
      **Resume hash:** abc123def456
      **Spec:** docs/specs/2026-04-25-user-api-design.md

      ## Coverage Matrix
      | Requirement | Related Tasks |
      |-------------|---------------|
      | R1: User CRUD | T1 |
      | R2: User search | T2 |
      | R3: User roles | T3 |

      ### Task 1: User model and CRUD [R1]
      - [x] **Step 1: Write test**
      - [x] **Step 2: Run test**
      - [x] **Step 3: Implement**
      - [x] **Step 4: Verify**
      - [x] **Step 5: Commit**

      ### Task 2: User search endpoint [R2]
      - [ ] **Step 1: Write test**

      ### Task 3: User roles [R3]
      - [ ] **Step 1: Write test**
    phases_index: |
      {"current_phase":"build","phases":{"build":{"status":"in_progress"}}}

graders:
  - type: deterministic_tests
    commands:
      - "echo 'grader placeholder — resume protocol check'"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Resume protocol detects previous session with Task 1 complete"
      - "User presented with resume/re-run/full-restart/abort options"
      - "Resume hash abc123def456 preserved for final diff range"
      - "Task 1 skipped as already complete (- [x] markers)"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [resume_detected, tasks_skipped, resume_hash_preserved]
