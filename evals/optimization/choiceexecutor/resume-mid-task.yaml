case_id: "optimization.resume_mid_task.005"
split: optimization
stratum:
  command: choice_execute
  difficulty: multi_step
  pattern: brownfield
  model_family: agnostic
  language: ko

input:
  user_message: |
    docs/plans/2026-04-25-user-api.md plan을 이어서 실행해줘.
  initial_files:
    - "docs/plans/2026-04-25-user-api.md"
    - "docs/specs/2026-04-25-user-api-design.md"
    - ".harness/config.json"
    - "phases/index.json"
  mock_data:
    plan_content: |
      # User API Implementation Plan
      **Goal:** Build user management API
      **Resume hash:** abc123def456
      **Spec:** docs/specs/2026-04-25-user-api-design.md

      ## Coverage Matrix
      | Requirement | Related Tasks |
      |-------------|---------------|
      | R1: User CRUD | T1 |
      | R2: User search | T2 |
      | R3: User roles | T3 |

      ### Task 1: User model and CRUD [R1]
      - [x] **Step 1: Write test**
      - [x] **Step 2: Run test**
      - [x] **Step 3: Implement**
      - [x] **Step 4: Verify**
      - [x] **Step 5: Commit**

      ### Task 2: User search endpoint [R2]
      - [ ] **Step 1: Write test**

      ### Task 3: User roles [R3]
      - [ ] **Step 1: Write test**
    phases_index: |
      {"current_phase":"build","phases":{"build":{"status":"in_progress"}}}

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; t=Path('commands/choice_execute.md').read_text(encoding='utf-8'); old1='Treat '+'`- [x]` tasks as PASS'; old2='Tasks checked '+'`- [x]` are treated as PASS'; assert 'scripts/harness-resume-proof.ps1' in t; assert 'checkboxes are progress hints, not PASS evidence' in t; assert old1 not in t; assert old2 not in t\""
      - "python -c \"from pathlib import Path; t=Path('docs/reference/verification-contract.md').read_text(encoding='utf-8'); assert 'harness-resume-proof.ps1' in t; assert 'Markdown checkboxes and resume hashes are continuity hints only' in t\""
      - "python -c \"from pathlib import Path; t=Path('scripts/harness-resume-proof.ps1').read_text(encoding='utf-8'); assert 'resume-proof.json' in t; assert 'stale_task_gate' in t; assert 'e2e_timeout_too_short' in t\""
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Resume protocol detects the possible previous session but treats checked boxes only as progress hints"
      - "User is presented with resume verified prefix, re-run, full restart, and abort options"
      - "Resume hash abc123def456 is preserved for final diff range only, not accepted as proof"
      - "Task 1 is skipped only if harness-resume-proof accepts fresh passing task-gate evidence"
      - "Missing or stale task-gate evidence routes to re-run instead of skip"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [resume_detected, resume_proof_required, resume_hash_preserved]
