      - (c) Code preservation: [`src/validators/email.ts:20-25`] — existing sanitization logic
      **Completion criteria (from spec):**
      - [ ] (R1) Given: Invalid email format, When: Validate, Then: Returns false, Verify: `node -e "assert(!require('./src/validators/email').validateEmail('bad'))"`, Verify-type: lib
