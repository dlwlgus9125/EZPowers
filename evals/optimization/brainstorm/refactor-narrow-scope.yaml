case_id: "optimization.refactor_narrow_scope.003"
split: optimization
stratum:
  command: brainstorm
  difficulty: single_step
  pattern: refactor
  model_family: agnostic
  language: en

input:
  user_message: |
    I need to refactor our authentication module. Currently it's a single
    800-line file handling JWT, session management, and OAuth. I want to
    split it into separate modules with clear interfaces.
  initial_files:
    - "src/auth.ts"
    - "src/routes/login.ts"
    - "src/middleware/requireAuth.ts"

graders:
  - type: deterministic_tests
    commands:
      - "test -f docs/specs/*.md"
      - "grep -qE 'Impact scope:' docs/specs/*.md"
      - "grep -qE 'Before state|Input:' docs/specs/*.md"
  - type: banned_expression_scan
    fail_on_match: true
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Spec limits scope to auth module split only — no unrelated changes"
      - "Impact scope identifies all consumers of the current auth.ts"
      - "Re-export awareness is applied for barrel files"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [r_count, verify_count, impact_scope_entries]
