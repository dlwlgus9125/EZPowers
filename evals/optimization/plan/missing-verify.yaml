case_id: "optimization.missing_verify.003"
split: optimization
stratum:
  command: plan
  difficulty: multi_step
  pattern: brownfield
  model_family: agnostic
  language: en

input:
  user_message: |
    Create a plan from the spec at docs/specs/2026-04-25-auth-design.md
  initial_files:
    - "docs/specs/2026-04-25-auth-design.md"
  mock_data:
    spec_content: |
      ## Extracted Requirements
      - R1: JWT token generation
      - R2: Token refresh mechanism
      - R3: Session invalidation

      ### R1: JWT token generation
      **Input:** User credentials
      **Behavior:** Validate credentials against DB, generate JWT with user claims
      **Output:** Signed JWT token
      **Impact scope:** None -- new component
      **Acceptance criteria:**
      - [ ] Given: Valid user credentials, When: Login request, Then: JWT returned, Verify: `curl -s localhost:3000/api/auth/login -d '{"email":"test@test.com","pass":"test"}' | jq -e '.token'`, Verify-type: api
      **Edge cases:**
      - Invalid credentials return 401

      ### R2: Token refresh mechanism
      **Input:** Expired access token + valid refresh token
      **Behavior:** Validate refresh token, issue new access token
      **Output:** New access token
      **Impact scope:** None -- new component
      **Acceptance criteria:**
      - [ ] Given: Expired access token, When: Refresh request, Then: New token issued
      **Edge cases:**
      - Expired refresh token returns 401

      ### R3: Session invalidation
      **Input:** Session ID
      **Behavior:** Remove session from store, invalidate all tokens
      **Output:** Confirmation of invalidation
      **Impact scope:** None -- new component
      **Acceptance criteria:**
      - [ ] Given: Active session, When: Logout request, Then: Session removed, Verify: `curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/auth/logout -H 'Authorization: Bearer $TOKEN'`, Verify-type: api
      **Edge cases:**
      - Double logout is idempotent

graders:
  - type: deterministic_tests
    commands:
      - "test -f docs/plans/*.md"
      - "grep -qE 'Coverage Matrix' docs/plans/*.md"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Plan detects R2 is missing Verify command in acceptance criteria"
      - "Plan either flags the gap or returns to brainstorm for spec fix"
      - "Plan does not silently ignore the missing Verify"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [missing_verify_detected, backward_transition_triggered]
