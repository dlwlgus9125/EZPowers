case_id: "optimization.large_ten_r_spec.002"
split: optimization
stratum:
  command: plan
  difficulty: long_horizon
  pattern: greenfield
  model_family: agnostic
  language: ko_en_mixed

input:
  user_message: |
    docs/specs/2026-04-25-ecommerce-design.md의 spec으로 plan을 만들어주세요.
  initial_files:
    - "docs/specs/2026-04-25-ecommerce-design.md"
  mock_data:
    spec_content: |
      ## Extracted Requirements
      - R1: Product catalog CRUD
      - R2: Product search with filters
      - R3: Shopping cart management
      - R4: User authentication
      - R5: Checkout flow
      - R6: Payment integration (Stripe)
      - R7: Order history
      - R8: Admin product management
      - R9: Inventory tracking
      - R10: Email notifications

graders:
  - type: deterministic_tests
    commands:
      - "test -f docs/plans/*.md"
      - "grep -qE 'Coverage Matrix' docs/plans/*.md"
      - "grep -cE 'R[0-9]+.*T[0-9]' docs/plans/*.md | awk -F: '{s+=$2} END {if(s>=10) exit 0; else exit 1}'"
      - "grep -qE 'Agent Assignment' docs/plans/*.md"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "All 10 Rs are mapped in Coverage Matrix"
      - "Token budget considerations mentioned for large task set"
      - "Task dependencies form a coherent graph"
      - "Sub-project decomposition considered given 10+ requirements"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [task_count, r_coverage_ratio, dependency_chains]
