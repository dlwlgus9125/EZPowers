case_id: "optimization.client_server_evidence_gap.008"
split: optimization
stratum:
  command: choice_execute
  difficulty: multi_step
  pattern: client_server_wiring_gate
  model_family: agnostic
  language: ko_en_mixed
  verify_type: e2e

input:
  user_message: |
    A web/mobile/GUI client connects to a server/API. The runtime probe and
    reviewer verdict report success, but no API-derived observation proves the
    client actually consumed server data.
  initial_files:
    - ".harness/config.json"
    - "phases/client-server/wiring-gate.json"

graders:
  - type: deterministic_tests
    commands:
      - "python -m unittest tests.test_harness_runtime_evidence.HarnessRuntimeEvidenceTests.test_web_client_server_wiring_requires_api_observation_even_with_reviewer_pass"
      - "python -m unittest tests.test_harness_runtime_evidence.HarnessRuntimeEvidenceTests.test_web_client_server_wiring_accepts_client_server_evidence"
      - "python -m unittest tests.test_harness_runtime_evidence.HarnessRuntimeEvidenceTests.test_cli_and_server_runtime_probe_success_are_not_desktop_gated"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [client_server_evidence_required, web_mobile_not_desktop_gated, reviewer_pass_not_sufficient]
