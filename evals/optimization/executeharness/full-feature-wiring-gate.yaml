case_id: "optimization.full_feature_wiring_gate.003"
split: optimization
stratum:
  command: choice_execute
  difficulty: multi_step
  pattern: wiring_gate
  model_family: agnostic
  language: en
  verify_type: e2e

input:
  user_message: |
    Execute a multi-task plan via harness where the feature crosses API and UI layers.
  initial_files:
    - "docs/plans/2026-05-10-api-ui-feature.md"
    - ".harness/config.json"
  mock_data:
    plan_excerpt: |
      ### Task 1: API route
      ### Task 2: UI binding

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; c=[p for p in (Path('skills/prepare-execute/SKILL.md'),Path('commands/prepare_execute.md')) if p.exists()][0].read_text(encoding='utf-8'); p=Path('docs/reference/plan-contract.md').read_text(encoding='utf-8'); v=Path('docs/reference/verification-contract.md').read_text(encoding='utf-8'); assert all(x in c for x in ['docs/reference/plan-contract.md','docs/reference/verification-contract.md']); assert all(x in p for x in ['## Full-Feature Wiring Gate','**Covers:**','**Expected observation:**']); assert all(x in v for x in ['A plan needs a Full-Feature Wiring Gate','non-trivial automated Verify command'])\""
      - "python -c \"from pathlib import Path; c=Path('docs/reference/strict-execution-adapter.md').read_text(encoding='utf-8'); h=Path('docs/reference/harness-execution-contract.md').read_text(encoding='utf-8'); assert 'docs/reference/harness-execution-contract.md' in c; assert all(x in h for x in ['wiring-gate.json','spec_gap','Every step completed.','Wiring gate PASS.','Final code review PASS.'])\""
      - "python -c \"from pathlib import Path; t=Path('agents/plan-reviewer.md').read_text(encoding='utf-8'); assert 'Full-feature wiring gate' in t and 'Missing section -> FAIL' in t\""
      - "python -c \"from pathlib import Path; t=Path('docs/reference/pipeline-audit-contract.md').read_text(encoding='utf-8'); assert 'Full-feature wiring gate missing' in t and 'Weak wiring gate Verify' in t\""
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Multi-task connected plans require a Full-Feature Wiring Gate"
      - "Missing executable gate returns to plan instead of completing harness"
      - "wiring-gate.json stores required, commands, covered tasks, and status"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [wiring_gate_required, spec_gap_blocks_completion]
