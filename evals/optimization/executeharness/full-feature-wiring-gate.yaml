case_id: "optimization.full_feature_wiring_gate.003"
split: optimization
stratum:
  command: executeharness
  difficulty: multi_step
  pattern: wiring_gate
  model_family: agnostic
  language: en
  verify_type: e2e

input:
  user_message: |
    Execute a multi-task plan via harness where the feature crosses API and UI layers.
  initial_files:
    - "docs/plans/2026-05-10-api-ui-feature.md"
    - ".harness/config.json"
  mock_data:
    plan_excerpt: |
      ### Task 1: API route
      ### Task 2: UI binding

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; t=Path('commands/plan.md').read_text(encoding='utf-8'); assert '## Full-Feature Wiring Gate' in t and 'Covers' in t and 'Expected observation' in t\""
      - "python -c \"from pathlib import Path; t=Path('commands/executeharness.md').read_text(encoding='utf-8'); assert 'wiring-gate.json' in t and 'spec_gap' in t and 'all steps completed + wiring gate PASS' in t\""
      - "python -c \"from pathlib import Path; t=Path('agents/plan-reviewer.md').read_text(encoding='utf-8'); assert 'Full-feature wiring gate' in t and 'Missing section -> FAIL' in t\""
      - "python -c \"from pathlib import Path; t=Path('commands/pipeline-audit.md').read_text(encoding='utf-8'); assert 'Full-feature wiring gate missing' in t and 'Weak wiring gate Verify' in t\""
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Multi-task connected plans require a Full-Feature Wiring Gate"
      - "Missing executable gate returns to plan instead of completing harness"
      - "wiring-gate.json stores required, commands, covered tasks, and status"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [wiring_gate_required, spec_gap_blocks_completion]
