case_id: "optimization.wiring_code_gap.005"
split: optimization
stratum:
  command: executeharness
  difficulty: long_horizon
  pattern: disconnected_feature
  model_family: agnostic
  language: ko_en_mixed
  verify_type: e2e

input:
  user_message: |
    Harness steps completed, but the UI never calls the new API route.
  initial_files:
    - "docs/plans/2026-05-10-dashboard-api.md"
    - "phases/dashboard-api/wiring-gate.json"
  mock_data:
    diff_summary: |
      API route added, UI component added, no import or route binding between them.

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; t=Path('agents/wiring-reviewer.md').read_text(encoding='utf-8'); assert 'CODE_GAP' in t and 'Route registration' in t and 'UI state or data binding' in t\""
      - "python -c \"from pathlib import Path; c=Path('commands/executeharness.md').read_text(encoding='utf-8'); h=Path('docs/reference/harness-execution-contract.md').read_text(encoding='utf-8'); v=Path('docs/reference/verification-contract.md').read_text(encoding='utf-8'); assert 'docs/reference/harness-execution-contract.md' in c and 'code_gap' in c; assert '`CODE_GAP`: set status `code_gap`.' in h; assert '`CODE_GAP`: registration, route, import, binding, subscription, or call site is missing.' in v\""
      - "python -c \"from pathlib import Path; t=Path('commands/choiceexecutor.md').read_text(encoding='utf-8'); assert '`CODE_GAP` -> reset the related harness step' in t\""
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "A disconnected route/API/UI feature is classified as CODE_GAP"
      - "CODE_GAP resets the related harness step instead of finishing"
      - "Wiring reviewer receives only plan path, diff range, phase directory, gate, status, and outputs"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [code_gap_detected, step_reset_required]
