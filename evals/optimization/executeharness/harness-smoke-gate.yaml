case_id: "optimization.harness_smoke_gate.004"
split: optimization
stratum:
  command: choice_execute
  difficulty: multi_step
  pattern: smoke_gate
  model_family: agnostic
  language: en
  verify_type: e2e

input:
  user_message: |
    Complete harness steps, but the full feature smoke command fails.
  initial_files:
    - "phases/checkout/index.json"
    - "phases/checkout/wiring-gate.json"
    - ".harness/config.json"
  mock_data:
    smoke_output: |
      {"status":"smoke_failed","exit_code":1}

graders:
  - type: deterministic_tests
    commands:
      - "python -c \"from pathlib import Path; c=Path('docs/reference/strict-execution-adapter.md').read_text(encoding='utf-8'); h=Path('docs/reference/harness-execution-contract.md').read_text(encoding='utf-8'); v=Path('docs/reference/verification-contract.md').read_text(encoding='utf-8'); assert all(x in c for x in ['docs/reference/harness-execution-contract.md','docs/reference/verification-contract.md']); assert all(x in h for x in ['runtime smoke for executable artifacts','Missing required smoke evidence is a failure, not a skip','Runtime smoke evidence when required','Continue to `/choice_execute` Final Code Review']); assert all(x in v for x in ['Executable artifacts (`cli`, `server`, `desktop`) require runtime smoke','missing required smoke command is failure, not skip'])\""
      - "python -c \"from pathlib import Path; t=Path('commands/choice_execute.md').read_text(encoding='utf-8'); assert 'wiring gate PASS + Final Code' in t\""
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Smoke failure blocks harness completion"
      - "Choiceexecutor Path 2 requires wiring gate PASS before final review"
      - "Step completion alone is not enough"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [smoke_failure_blocks_completion, path2_gate_required]
