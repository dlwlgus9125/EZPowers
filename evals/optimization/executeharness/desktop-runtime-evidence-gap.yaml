case_id: "optimization.desktop_runtime_evidence_gap.007"
split: optimization
stratum:
  command: choice_execute
  difficulty: multi_step
  pattern: desktop_wiring_gate
  model_family: agnostic
  language: ko_en_mixed
  verify_type: e2e

input:
  user_message: |
    Desktop runtime-probe.json reports success, but there is no screenshot,
    UI text, automation-name, or API observation proving desktop/server wiring.
  initial_files:
    - ".harness/config.json"
    - "phases/desktop-api/wiring-gate.json"

graders:
  - type: deterministic_tests
    commands:
      - "python -m unittest tests.test_harness_runtime_evidence.HarnessRuntimeEvidenceTests.test_desktop_runtime_probe_without_desktop_evidence_fails_even_with_reviewer_pass"
      - "python -m unittest tests.test_harness_runtime_evidence.HarnessRuntimeEvidenceTests.test_desktop_runtime_probe_with_screenshot_ui_and_api_evidence_passes"
      - "python -m unittest tests.test_harness_runtime_evidence.HarnessRuntimeEvidenceTests.test_desktop_server_wiring_requires_api_observation"
      - "python -m unittest tests.test_harness_runtime_evidence.HarnessRuntimeEvidenceTests.test_cli_and_server_runtime_probe_success_are_not_desktop_gated"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [desktop_evidence_required, reviewer_pass_not_sufficient, cli_server_not_regressed]
