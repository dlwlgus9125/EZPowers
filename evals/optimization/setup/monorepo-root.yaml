case_id: "optimization.monorepo_root.003"
split: optimization
stratum:
  command: setup
  difficulty: multi_step
  pattern: brownfield
  model_family: agnostic
  language: en

input:
  user_message: |
    Set up EZPowers for this monorepo. We have packages/api and packages/web.
    I want to work on the API package specifically.
  initial_files:
    - "package.json"
    - "packages/api/package.json"
    - "packages/api/src/index.ts"
    - "packages/web/package.json"
    - "packages/web/src/App.tsx"
    - "turbo.json"

graders:
  - type: deterministic_tests
    commands:
      - "test -f .harness/config.json"
      - "test -f AGENTS.md"
  - type: llm_rubric
    rubric: evals/rubrics/spec_quality.md
    assertions:
      - "Setup correctly identifies monorepo structure"
      - "Config references the target package (packages/api)"
      - "User asked which package to focus on before proceeding"

tracked_metrics:
  transcript: [n_turns, n_toolcalls, n_total_tokens]
  custom: [monorepo_detected, package_scope_confirmed]
